<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Arkaya</title>
  <!--
    Tek dosyada iki sürüm: koyu tema tarayıcılarda siyah logo görünmediği için
    beyaz sürüme geçilir. Chrome, Firefox ve Edge SVG favicon içindeki
    prefers-color-scheme sorgusunu uygular; Safari 16.4+ de destekler.
    Eski tarayıcılar favicon.ico'ya düşer (siyah sürüm).
    Yeniden üretmek için: public/only-logo.png -> scripts yok, README'ye bak.
  -->
  <style>
    #dark { display: none; }
    @media (prefers-color-scheme: dark) {
      #light { display: none; }
      #dark { display: inline; }
    }
  </style>
  <image id="light" width="512" height="512" href="data:image/png;base64,"/>
  <image id="dark" width="512" height="512" href="data:image/png;base64,"/>
</svg>
